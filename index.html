<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社工的一天</title>
<style>
:root{
  --cream:#f6efe2; --paper:#fffaf0; --sand:#ead9bc; --sand-d:#d8c3a0;
  --green:#6f9d7e; --green-d:#3f6b52; --green-l:#e1eedf;
  --orange:#d9894a; --orange-d:#b86a30; --orange-l:#f8e2c8;
  --brown:#8a5a3b; --brown-d:#5e3d27;
  --ink:#3b2f27; --muted:#7a6a5c; --red:#c2573f; --red-l:#f7ddd5;
  --shadow:0 6px 18px rgba(94,61,39,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;font-size:16px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--paper);border:2px solid var(--sand);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.fade{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:clamp(27px,6vw,38px);line-height:1.25;color:var(--brown-d);letter-spacing:.04em}
h2{font-size:21px;color:var(--brown-d);margin-bottom:8px}
h3{font-size:17px;color:var(--brown-d);margin-bottom:4px}
.eyebrow{color:var(--green-d);font-weight:700;letter-spacing:.1em;font-size:13.5px}
.mt{margin-top:14px}.mt2{margin-top:24px}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 26px;border-radius:999px;background:var(--green-d);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 #2c4d3a;transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{background:#4a7b60}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2c4d3a}
.btn.orange{background:var(--orange-d);box-shadow:0 4px 0 #8a4f22}
.btn.orange:hover{background:#c97a3b}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.notice{font-size:13px;color:var(--muted);background:var(--orange-l);border-radius:12px;padding:10px 14px;margin-top:14px}
.warnbox{font-size:14px;color:#7a3a28;background:var(--red-l);border:2px solid #e8b4a6;border-radius:14px;padding:10px 14px;margin-top:14px}
.warnbox b{display:block;margin-bottom:2px}
.hero{font-size:64px;text-align:center;line-height:1.2;margin:6px 0}
.story p{margin:9px 0}

/* 狀態欄 */
#hud{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--sand);padding:8px 10px 7px;box-shadow:0 3px 10px rgba(94,61,39,.1)}
.hud-in{max-width:760px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fff;border:2px solid var(--sand);border-radius:12px;padding:5px 10px 6px;min-width:0;transition:background .3s,border-color .3s}
.stat small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat b{display:block;font-size:17px;line-height:1.3;color:var(--brown-d);white-space:nowrap}
.stat.over{border-color:var(--red);background:#fff4ef}.stat.over b{color:var(--red)}
.stat.pulse{animation:pulse .7s}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.06);background:var(--orange-l)}100%{transform:scale(1)}}
.steps{display:flex;gap:5px;margin-top:7px}
.step{flex:1;text-align:center;font-size:11px;padding:2px 0;border-radius:8px;background:var(--sand);color:var(--muted)}
.step.done{background:var(--green-l);color:var(--green-d)}
.step.cur{background:var(--orange-d);color:#fff;font-weight:800}

/* 情境 */
.scene-head{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--green-l),var(--paper))}
.scene-head .emo{font-size:46px;line-height:1;flex:none}
.scene-head .tm{font-weight:800;color:var(--orange-d);font-size:15px}
.scene-head .pl{font-size:13px;color:var(--muted)}
.dlg{margin-top:12px}
.bubble{background:var(--paper);border:2px solid var(--sand);border-radius:16px;padding:10px 14px;margin:0 0 10px;box-shadow:0 3px 8px rgba(94,61,39,.08);animation:fadeIn .35s both}
.bubble .who{font-size:12.5px;font-weight:800;color:var(--green-d);letter-spacing:.05em}
.bubble.nar{background:#f3ead7;border-style:dashed}.bubble.nar .who{color:var(--muted)}
.bubble.me{background:var(--green-l);border-color:#bcd6bd}.bubble.me p{font-style:italic}
.bubble.alert{background:var(--orange-l);border-color:var(--orange)}.bubble.alert .who{color:var(--orange-d)}
.bubble.danger{background:var(--red-l);border-color:#e0a595}.bubble.danger .who{color:var(--red)}
.hintline{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 8px}

/* 桌面道具 */
.desk{background:linear-gradient(180deg,#c99a67,#b9824f);border:3px solid #a06d3f;border-radius:18px;padding:12px 12px 14px;margin:10px 0 14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.18);animation:fadeIn .4s both}
.desk-t{font-size:13.5px;color:#fff7e8;font-weight:700;margin-bottom:8px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.props{display:flex;gap:12px;flex-wrap:wrap}
.prop{flex:1 1 150px;min-height:92px;background:#fffdf3;border:2px solid #e6d5b0;border-radius:6px;padding:10px 12px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.25);transition:transform .15s}
.prop:nth-child(odd){transform:rotate(-1.6deg)}.prop:nth-child(even){transform:rotate(1.4deg)}
.prop:hover{transform:rotate(0) scale(1.03)}
.prop .pi{display:block;font-size:30px;line-height:1.2}
.prop .pn{display:block;font-weight:800;color:var(--brown-d);font-size:15px}
.prop .pt{display:block;font-size:12px;color:var(--orange-d);font-weight:700}
.prop.req{border-color:var(--orange);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 6px rgba(217,137,74,.35),0 4px 8px rgba(0,0,0,.25)}}
.prop.seen{opacity:.85;animation:none}.prop.seen .pt{color:var(--green-d)}

.must{background:#fff;border:2px dashed var(--green);border-radius:14px;padding:10px 14px;margin:6px 0 12px;font-size:14px;animation:fadeIn .4s both}
.must b{color:var(--green-d)}.must ul{margin:4px 0 0 20px}
.ctitle{font-weight:800;color:var(--brown-d);margin:8px 2px}
.choice{display:block;width:100%;text-align:left;background:var(--paper);border:2.5px solid var(--sand-d);border-radius:16px;padding:12px 14px 12px 54px;margin:0 0 10px;position:relative;min-height:64px;box-shadow:0 3px 0 var(--sand-d);transition:transform .12s,border-color .15s,background .15s;animation:fadeIn .4s both}
.choice:hover{border-color:var(--green);background:#fbfff7}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sand-d)}
.choice .ltr{position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.choice strong{display:block;font-size:16.5px;color:var(--brown-d);line-height:1.5}
.choice .d{display:block;font-size:14px;margin-top:3px}
.choice .m{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.choice.chosen{border-color:var(--orange-d);background:var(--orange-l)}.choice.chosen .ltr{background:var(--orange-d)}
.choice.dim{opacity:.4;pointer-events:none}

/* 彈窗 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(59,47,39,.58);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeBg .3s both}
.modal.center{align-items:center;padding:14px}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;border:2px solid var(--sand-d);animation:sheetUp .4s ease both}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:22px}}
.sheet h2{color:var(--green-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;border:2px solid var(--sand-d);background:#fff}
.chip.bad{border-color:var(--red);color:var(--red);background:var(--red-l)}
.box{border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px}
.box h4{font-size:14px;margin-bottom:2px}
.box.res{background:#fff;border:2px solid var(--sand)}
.box.ref{background:var(--green-l)}.box.ref h4{color:var(--green-d)}
.box.lim{background:var(--orange-l)}.box.lim h4{color:var(--orange-d)}
.bfly{font-size:13.5px;color:var(--muted);text-align:center;margin:8px 0}

/* 證物紙張 */
.sheet.paper{background:#fffdf3;background-image:repeating-linear-gradient(transparent,transparent 31px,#e9dfc3 32px);border-color:#e1d3ac}
.paper .pt-t{font-size:20px;font-weight:800;color:var(--brown-d);margin-bottom:8px}
.paper .entry{margin:10px 0;padding:8px 10px;background:rgba(255,255,255,.75);border-left:4px solid var(--orange);border-radius:6px}
.paper .entry b{color:var(--orange-d)}
.paper .art{border:3px solid #e1d3ac;border-radius:8px;overflow:hidden;background:#fffdf3;margin:6px 0}
.paper .art svg{display:block;width:100%;height:auto}
.paper .pnote{margin-top:10px;font-size:14.5px;color:var(--brown-d);background:var(--orange-l);border-radius:10px;padding:8px 12px}

/* 手機訊息 */
.phone{width:100%;max-width:360px;background:#fff;border-radius:30px;border:7px solid #2d2d2d;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:sheetUp .4s both}
.ph-top{background:var(--green-d);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between}
.ph-body{background:#e9eef2;min-height:300px;max-height:56dvh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{align-self:flex-start;max-width:82%;background:#fff;border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.15);animation:fadeIn .3s both}
.ph-foot{background:#fff;padding:10px;text-align:center;min-height:62px}
.ringing{margin:auto;text-align:center;font-size:20px;font-weight:700;color:var(--brown-d);animation:ringShake .5s infinite}
.ringing small{font-weight:400;color:var(--muted);font-size:14px}
.ringing .big{font-size:54px;display:block}
@keyframes ringShake{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* 問卷 */
.q{margin:16px 0;padding:14px;border-radius:14px;background:#fff;border:2px solid var(--sand)}
.q p{font-weight:700;margin-bottom:10px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk{min-height:56px;border-radius:12px;border:2px solid var(--sand-d);background:var(--paper);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px 2px;transition:.15s}
.lk small{font-size:10.5px;font-weight:400;color:var(--muted);margin-top:2px}
.lk:hover{border-color:var(--green)}
.lk.sel{background:var(--green);border-color:var(--green-d);color:#fff}.lk.sel small{color:#eaf5ec}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid var(--sand-d);padding:10px 12px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink);resize:vertical}

/* 結局 */
.end-hero{text-align:center;background:linear-gradient(180deg,var(--green-l),var(--paper))}
.end-hero .badge{font-size:50px}
.endstats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chain{margin:10px 0;padding:12px 14px;background:#fff;border:2px solid var(--sand);border-radius:14px}
.chain .rt{font-weight:800;color:var(--brown-d)}
.chain .rc{color:var(--green-d);font-weight:700;margin:2px 0}
.chain p{font-size:14.5px;margin-top:3px}
.flagcard{margin:10px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--sand);background:#fff}
.flagcard.on{border-color:var(--orange);background:#fffaf2}
.flagcard.good{border-color:var(--green);background:#f6fbf4}
.flagcard .fh{display:flex;justify-content:space-between;gap:8px;font-weight:800;color:var(--brown-d);flex-wrap:wrap}
.flagcard .st{font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--sand)}
.flagcard.on .st{background:var(--orange-l);color:var(--orange-d)}
.flagcard.good .st{background:var(--green-l);color:var(--green-d)}
.flagcard p{font-size:14.5px;margin-top:4px}
.know{display:grid;gap:10px}
.know div{background:#fff;border:2px solid var(--sand);border-radius:14px;padding:10px 14px}
.know b{color:var(--green-d)}.know p{font-size:14.5px;margin-top:2px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--sand);padding:8px 6px;text-align:center}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
.flag-demo{background:var(--red-l);border:2px solid var(--red);color:#8a3a27;border-radius:14px;padding:10px 14px;font-weight:800;text-align:center;margin:16px 0}
.adv li{margin:8px 0 8px 20px}

/* 過場 */
#curtain{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#3f6b52,#2f5240);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s;text-align:center;padding:20px}
#curtain.in{opacity:1;pointer-events:auto}
#curtain .ct{font-size:clamp(48px,14vw,84px);font-weight:800;letter-spacing:.05em;animation:rise .7s both}
#curtain .cn{font-size:20px;margin-top:6px;animation:rise .7s .15s both}
#curtain .cs{font-size:14px;margin-top:10px;opacity:.8;animation:rise .7s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:480px){
  body{font-size:15.5px}
  .btn{font-size:16px;padding:12px 20px}
  .lk small{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hud" hidden></header>
<main id="screen"></main>
<div id="modal" class="modal" hidden></div>
<div id="curtain"><div class="ct" id="ctT"></div><div class="cn" id="ctN"></div><div class="cs" id="ctS"></div></div>

<script>
/* =====================================================================
   GAME_DATABASE：遊戲狀態、隱藏標籤、五個情境、道具、LINE 訊息、結局與所有介面文字。
   想改文案、數值或連鎖規則，只需要改這個物件。
   ===================================================================== */
const GAME_DATABASE={
  meta:{title:'社工的一天',delayMs:900,phoneDelayMs:950},

  /* 初始狀態（時間單位：小時） */

    ],
    open:'玩完之後，你對社工的工作，有什麼新的想法或感想？',

    start:{
      eyebrow:'互動體驗遊戲',

        '你是一位社工，工作是陪伴遇到困難的孩子和家庭，也要在孩子可能有危險的時候，趕快做出決定。',
        '今天從早上九點到傍晚五點，你會遇到五件彼此牽連的事。你可以翻看桌上的東西、接手機訊息，再決定怎麼做。',

      ],

    pre:{eyebrow:'開始前 ・ 2 個小問題',title:'你現在了解多少？',desc:'請照你現在的真實感覺回答（1＝非常不同意，5＝非常同意）。答案只會留在你的瀏覽器裡。',next:'進入今天的工作 ▶'},

    game:{

      deskTitle:'📎 桌上的東西（點一點看看，不會花時間）',
      deskTitleLine:'📎 手機',
      skipHint:'輕點對話區，可以直接看完全部',
      choiceTitle:'你會怎麼做？',
      estimate:'大概會花 {t}',
      supportCost:'，並用掉 {s} 份支援',
      seen:'已看過 ✔',
      faceMoment:'面對這一刻 ▶',
      seeFeedback:'看看發生了什麼 ▶'
    },
    phone:{calling:'來電中…',answer:'接聽',close:'關閉手機'},
    paper:{close:'放回桌上'},
    modal:{
      title:'這個決定之後',
      happened:'發生了什麼',
      reflect:'想一想',
      limit:'現實的難處',

      timeChip:'時間 −{t}',
      supportChip:'支援 −{s} 份',
      noChange:'沒有用掉支援',
      butterfly:'🦋 有些影響，不一定馬上看得到。',
      next:'繼續下一件事 ▶',
      last:'今天結束了 ▶'
    },
    curtain:{endTime:'18:00',endTitle:'一天結束了',endSub:'一起回頭看看今天的選擇'},
    post:{eyebrow:'一天結束 ・ 再回答一次',title:'現在的你，怎麼想？',desc:'請再回答一次同樣的 2 題，並寫下一點感想（1＝非常不同意，5＝非常同意）。',next:'看看我的結果 ▶'},
    ending:{
      eyebrow:'你的這一天',
      notScore:'這不是分數，也不是考試成績，只是依照你今天的選擇，呈現的其中一種結果，也不代表任何真實案件。',
      thoughtTitle:'🔍 想一想',
      pathTitle:'🧭 你今天走過的路',
      pathLabel:'你的選擇：',
      costLabel:'花掉：',
      propsLabel:'做決定前，你看了 {a} / {b} 樣東西。',
      flagTitle:'🌱 悄悄留下來的小種子',
      flagIntro:'下面是今天悄悄累積的幾顆「小種子」。它們不是在打分數，而是讓你看見：一個當下的決定，怎麼在稍後的時刻產生影響。',
      settleTitle:'📊 今天的結算',
      settleTime:'剩下的時間',
      settleSupport:'剩下的支援',

     off:'一開始你選擇帶孩子去醫院，也單獨聽聽他怎麼說。孩子比較安全，你也少背了一個沒解開的疑慮，代價是時間與一份支援。'},
    {key:'worker_endangered',label:'衝上去擋車，讓自己陷入危險',kind:'risk',stOn:'🔸 留下了',stOff:'✅ 沒有留下',
     on:'上午你衝上車想保護孩子，讓自己陷入險境。這個經驗消耗了你的時間與力氣，也成為傍晚那一刻最重的負擔。',
     off:'上午你冷靜地報警，把攔截交給警方，保住了自己的安全，也保住了之後做判斷的力氣。'},

     on:'下午你在還沒弄清楚之前，就做出了最強硬的處置。這個倉促的決定，增加了後面的不確定，也加重了你的壓力。',
     off:'下午你沒有急著下結論，也沒有省略該做的通知，而是慢慢弄清楚，避免了倉促決定的風險。'},
    {key:'trust_built',label:'讓孩子願意慢慢說出來',kind:'good',stOn:'🌱 長出來了',stOff:'— 還沒長出來',
     on:'你花時間陪孩子，讓他有機會被聽見。這份「慢下來」的練習，也讓你在後面的時刻更有底氣。',
     off:'你沒有走到這一步。信任需要時間，也需要有人允許你把時間花在這裡。'},

     on:'你用好意的建議回應少年，他卻把心門關上了；你也少了一次聽懂他真正擔心什麼的機會。',

    '要弄清楚一件事，需要時間。多問幾次、慢慢陪孩子，需要有人給這樣的時間，而不是只追求快。',

    '如果你對這份工作有興趣，歡迎多認識社工的團體與倡議，也可以參加志工或參訪活動，更近一點看看。'
  ],

    {t:'看到孩子受傷，為什麼要多確認？',p:'孩子不一定會主動說出發生了什麼，大人的說法也可能不完整。拍照記錄、請醫生檢查、單獨聽聽孩子怎麼說，都是幫助大家看得更清楚的方法。依照法律，遇到孩子可能受到傷害的情形，一定要通知相關單位。（實際做法，請以最新法規與機構規定為準。）'},
    {t:'遇到危險，先保護自己',p:'當情況可能出現暴力，優先確保自己和孩子的安全，並請警察與相關單位協助。社工不是救援人員，保護好自己，才有辦法繼續幫助更多人。'},
    {t:'孩子說的話，要認真聽，也要多方確認',p:'孩子的話必須被認真對待，但也要由受過訓練的專業人員，用不引導的方式慢慢了解，避免讓孩子再次受到傷害。誰說的是真的，不應該由一個人單獨判斷。'},

    {t:'工作量與幫手',p:'社工同時照顧很多個案，也要寫紀錄、開會、處理突發狀況。有足夠的人手與支持，才能讓每一次的決定，都有被好好思考的空間。'}

</script>

<script>
/* ===================== 引擎：只負責規則與畫面，不含劇本文字 ===================== */
const DB=GAME_DATABASE;
const $=s=>document.querySelector(s);
let playerState=null;
let timers=[];

function newPlayerState(){
  const i=DB.initialState;
  return {timeRemaining:i.timeRemaining,supportPoints:i.supportPoints,flags:Object.assign({},i.flags),
    sceneIndex:0,history:[],endingKey:null,opened:{},advanced:{},pre:{},post:{}};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(str,o){return str.replace(/\{(\w+)\}/g,(m,k)=>o[k]);}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function fmtHours(h){
  const neg=h<0,m=Math.round(Math.abs(h)*60),hh=Math.floor(m/60),mm=m%60;
  let t=(hh?hh+' 小時':'')+(mm?(hh?' ':'')+mm+' 分':'');
  if(!t)t='0 小時';
  return neg?'加班 '+t:t;
}
function matches(c){
  if(!c)return true;
  const f=playerState.flags;
  if(c.all&&!c.all.every(k=>f[k]===true))return false;
  if(c.any&&!c.any.some(k=>f[k]===true))return false;
  if(c.none&&!c.none.every(k=>f[k]===false))return false;
  if(typeof c.timeBelow==='number'&&!(playerState.timeRemaining<c.timeBelow))return false;
  return true;
}
function scrollEnd(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40);}
function setScreen(html){clearTimers();$('#screen').innerHTML=html;window.scrollTo(0,0);}
function curtain(t,n,s,mid,end){
  $('#ctT').textContent=t;$('#ctN').textContent=n;$('#ctS').textContent=s||'';
  const c=$('#curtain');c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
  setTimeout(()=>{mid&&mid();},550);
  setTimeout(()=>{c.classList.remove('in');end&&end();},1900);
}

/* ---------- 狀態欄（只顯示時間與支援） ---------- */
function updateHud(pulseIds){
  const u=DB.ui.hud,s=playerState;
  const steps=DB.scenes.map((sc,i)=>'<span class="step '+(i<s.sceneIndex?'done':i===s.sceneIndex?'cur':'')+'">'+(i<s.sceneIndex?'✔ ':'')+esc(sc.time)+'</span>').join('');
  const hud=$('#hud');hud.hidden=false;
  hud.innerHTML='<div class="hud-in"><div class="stats">'+
    '<div class="stat '+(s.timeRemaining<0?'over':'')+'" id="stT"><small>'+u.time+'</small><b>'+esc(fmtHours(s.timeRemaining))+'</b></div>'+
    '<div class="stat" id="stS"><small>'+u.support+'</small><b>'+s.supportPoints+u.supportUnit+'</b></div>'+
    '</div><div class="steps">'+steps+'</div></div>';
  (pulseIds||[]).forEach(id=>{const e=$(id);if(e)e.classList.add('pulse');});
}

/* ---------- 開場與問卷 ---------- */
function renderStart(){
  const u=DB.ui.start;
  $('#hud').hidden=true;
  setScreen('<div class="wrap fade"><div class="hero">'+u.hero+'</div><p class="eyebrow center">'+esc(u.eyebrow)+'</p>'+
    '<h1 class="center">'+u.title+'</h1>'+
    '<div class="card story mt2">'+u.intro.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+
    '<div class="warnbox"><b>'+esc(u.warnTitle)+'</b>'+esc(u.warn)+'<br><br>'+esc(u.resources)+'</div>'+
    '<div class="center mt2"><button class="btn orange" id="btnBegin">'+esc(u.begin)+'</button></div>'+
    '<p class="notice">'+esc(u.disclaimer)+'</p></div>');
  $('#btnBegin').onclick=renderPre;
}
function likertHtml(){
  return DB.survey.likert.map(q=>'<div class="q" data-k="'+q.key+'"><p>'+esc(q.text)+'</p><div class="likert">'+
    DB.survey.scale.map((lab,i)=>'<button type="button" class="lk" data-v="'+(i+1)+'">'+(i+1)+'<small>'+esc(lab)+'</small></button>').join('')+'</div></div>').join('');
}
function bindLikert(store,onChange){
  document.querySelectorAll('.q[data-k]').forEach(q=>{
    q.querySelectorAll('.lk').forEach(b=>{
      b.onclick=()=>{store[q.dataset.k]=+b.dataset.v;q.querySelectorAll('.lk').forEach(x=>x.classList.toggle('sel',x===b));onChange();};
    });
  });
}
function allAnswered(store){return DB.survey.likert.every(q=>store[q.key]);}
function saveLocal(){try{localStorage.setItem('sw_props_demo',JSON.stringify({pre:playerState.pre,post:playerState.post}));}catch(e){}}
function renderPre(){
  const u=DB.ui.pre;
  $('#hud').hidden=true;
  setScreen('<div class="wrap fade"><p class="eyebrow">'+esc(u.eyebrow)+'</p><h2>'+esc(u.title)+'</h2><p>'+esc(u.desc)+'</p>'+likertHtml()+
    '<div class="center mt"><button class="btn" id="btnPreGo" disabled>'+esc(u.next)+'</button></div></div>');
  bindLikert(playerState.pre,()=>{$('#btnPreGo').disabled=!allAnswered(playerState.pre);});
  $('#btnPreGo').onclick=()=>{saveLocal();goScene(0);};
}

/* ---------- 情境流程 ---------- */
function goScene(i){
  const sc=DB.scenes[i];
  playerState.sceneIndex=i;
  curtain(sc.time,sc.title,fmt(DB.ui.game.sceneOf,{n:i+1,total:DB.scenes.length}),()=>{renderScene(i);},null);
}
function bubble(line){
  const sp=DB.speakers[line.s]||DB.speakers.nar;
  const kind=line.kind?line.kind:(line.s==='nar'?'nar':line.s==='me'?'me':'');
  const d=document.createElement('div');
  d.className='bubble '+kind;
  const who=document.createElement('div');who.className='who';who.textContent=sp.name;
  const p=document.createElement('p');p.textContent=line.t;
  d.appendChild(who);d.appendChild(p);
  return d;
}
function revealSequence(container,lines,onDone){
  let i=0,done=false;
  const finish=()=>{
    if(done)return;done=true;clearTimers();
    while(i<lines.length){container.appendChild(bubble(lines[i++]));}
    container.onclick=null;scrollEnd();onDone();
  };
  const step=()=>{
    if(done)return;
    if(i>=lines.length){done=true;container.onclick=null;onDone();return;}
    container.appendChild(bubble(lines[i++]));scrollEnd();
    timers.push(setTimeout(step,DB.meta.delayMs));
  };
  container.onclick=finish;
  step();
}
function renderScene(i){
  const sc=DB.scenes[i],g=DB.ui.game;
  updateHud();
  setScreen('<div class="wrap"><div class="card scene-head fade"><div class="emo">'+sc.emoji+'</div><div><div class="tm">'+esc(sc.time)+'　'+esc(fmt(g.sceneOf,{n:i+1,total:DB.scenes.length}))+'</div><h2 style="margin:0">'+esc(sc.title)+'</h2><div class="pl">'+esc(sc.place)+'</div></div></div>'+
    '<div class="dlg" id="dlg"></div><div class="hintline" id="hintline">'+esc(g.skipHint)+'</div><div id="propsBox"></div><div id="actions"></div></div>');
  const lines=sc.lines.filter(l=>matches(l.when));
  revealSequence($('#dlg'),lines,()=>{$('#hintline').hidden=true;showProps(sc,i);});
}

/* ---------- 桌面道具：證物與手機訊息 ---------- */
function showProps(sc,i){
  if(sc.props&&sc.props.length){
    const g=DB.ui.game,hasPaper=sc.props.some(p=>p.type==='paper');
    $('#propsBox').innerHTML='<div class="desk"><div class="desk-t">'+esc(hasPaper?g.deskTitle:g.deskTitleLine)+'</div><div class="props">'+
      sc.props.map(p=>'<button class="prop'+(p.required?' req':'')+'" data-id="'+p.id+'"><span class="pi">'+p.icon+'</span><span class="pn">'+esc(p.label)+'</span><span class="pt">'+esc(p.tag)+'</span></button>').join('')+'</div></div>';
    sc.props.forEach(p=>{
      const btn=document.querySelector('.prop[data-id="'+p.id+'"]');
      btn.onclick=()=>openProp(sc,i,p,btn);
    });
    scrollEnd();
  }
  checkProps(sc,i);
}
function checkProps(sc,i){
  const req=(sc.props||[]).filter(p=>p.required);
  if(req.every(p=>playerState.opened[p.id]))advance(sc,i);
}
function advance(sc,i){
  if(playerState.advanced[i])return;
  playerState.advanced[i]=true;
  const lines=(sc.afterLines||[]).filter(l=>matches(l.when));
  if(lines.length)revealSequence($('#dlg'),lines,()=>{showActions(sc,i);});
  else showActions(sc,i);
}
function openProp(sc,i,p,btn){
  const el=$('#modal');
  const finish=()=>{
    el.hidden=true;el.innerHTML='';
    playerState.opened[p.id]=true;
    btn.classList.add('seen');btn.classList.remove('req');
    btn.querySelector('.pt').textContent=DB.ui.game.seen;
    checkProps(sc,i);
  };
  if(p.type==='paper'){
    el.className='modal';
    el.innerHTML='<div class="sheet paper"><div class="pt-t">'+esc(p.title)+'</div>'+
      (p.art?'<div class="art">'+p.art+'</div>':'')+
      (p.entries?p.entries.map(e=>'<div class="entry"><b>'+esc(e.h)+'</b><p>'+esc(e.t)+'</p></div>').join(''):'')+
      (p.note?'<div class="pnote">'+esc(p.note)+'</div>':'')+
      '<div class="center mt"><button class="btn" id="btnPaperClose">'+esc(DB.ui.paper.close)+'</button></div></div>';
    el.hidden=false;
    $('#btnPaperClose').onclick=finish;
  }else{
    openPhone(p,finish);
  }
}
function openPhone(p,onClose){
  const u=DB.ui.phone,el=$('#modal');
  el.className='modal center';
  el.innerHTML='<div class="phone"><div class="ph-top"><span>'+esc(p.contact)+'</span><span>LINE</span></div><div class="ph-body" id="phBody"></div><div class="ph-foot" id="phFoot"></div></div>';
  el.hidden=false;
  const body=$('#phBody'),foot=$('#phFoot');
  const start=()=>{
    body.innerHTML='';foot.innerHTML='';
    let k=0;
    const step=()=>{
      if(k>=p.messages.length){
        foot.innerHTML='<button class="btn orange" id="btnPhClose">'+esc(u.close)+'</button>';
        $('#btnPhClose').onclick=onClose;
        return;
      }
      const m=document.createElement('div');m.className='msg';m.textContent=p.messages[k++].t;
      body.appendChild(m);body.scrollTop=body.scrollHeight;
      timers.push(setTimeout(step,DB.meta.phoneDelayMs));
    };
    step();
  };
  if(p.ring){
    body.innerHTML='<div class="ringing"><span class="big">📞</span>'+esc(p.contact)+'<br><small>'+esc(u.calling)+'</small></div>';
    foot.innerHTML='<button class="btn" id="btnPhAnswer">'+esc(u.answer)+'</button>';
    $('#btnPhAnswer').onclick=start;
  }else start();
}

/* ---------- 選項與結果 ---------- */
function propsSeen(sc){
  const ps=sc.props||[];
  return {a:ps.filter(p=>playerState.opened[p.id]).length,b:ps.length};
}
function showActions(sc,i){
  const g=DB.ui.game,box=$('#actions');
  let h='';
  if(sc.reminders&&sc.reminders.length)h+='<div class="must"><ul>'+sc.reminders.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul></div>';
  if(sc.branches){
    h+='<div class="center mt"><button class="btn orange" id="btnFace">'+esc(g.faceMoment)+'</button></div>';
    box.innerHTML=h;
    $('#btnFace').onclick=()=>faceMoment(sc,i);
  }else{
    h+='<div class="ctitle">'+esc(g.choiceTitle)+'</div><div id="choiceList"></div>';
    box.innerHTML=h;
    const list=$('#choiceList');
    sc.choices.forEach((ch,k)=>{
      const b=document.createElement('button');b.className='choice';
      const est=fmt(g.estimate,{t:fmtHours(ch.cost.time)})+(ch.cost.support?fmt(g.supportCost,{s:ch.cost.support}):'');
      b.innerHTML='<span class="ltr">'+(k+1)+'</span><strong></strong><span class="d"></span><span class="m"></span>';
      b.querySelector('strong').textContent=ch.label;
      b.querySelector('.d').textContent=ch.desc;
      b.querySelector('.m').textContent=est;
      b.onclick=()=>pickChoice(sc,i,k,list,b);
      list.appendChild(b);
    });
  }
  scrollEnd();
}
function applyCost(cost){
  playerState.timeRemaining-=cost.time;
  playerState.supportPoints=Math.max(0,playerState.supportPoints-(cost.support||0));
}
function pickChoice(sc,i,k,list,btn){
  const ch=sc.choices[k],ps=propsSeen(sc);
  list.querySelectorAll('.choice').forEach(b=>b.classList.add(b===btn?'chosen':'dim'));
  applyCost(ch.cost);
  Object.keys(ch.setFlags||{}).forEach(f=>{playerState.flags[f]=ch.setFlags[f];});
  playerState.history.push({sceneIndex:i,time:sc.time,title:sc.title,label:ch.label,costTime:ch.cost.time,costSupport:ch.cost.support||0,propsA:ps.a,propsB:ps.b});
  updateHud(['#stT','#stS']);
  setTimeout(()=>showModal(ch,ch.cost,i),450);
}
function faceMoment(sc,i){
  $('#actions').innerHTML='';
  const br=sc.branches.find(b=>matches(b.when));
  applyCost(br.cost);
  playerState.endingKey=br.ending;
  const ps=propsSeen(sc);
  playerState.history.push({sceneIndex:i,time:sc.time,title:sc.title,label:br.pathTitle,costTime:br.cost.time,costSupport:br.cost.support||0,propsA:ps.a,propsB:ps.b});
  updateHud(['#stT']);
  const lines=br.lines.filter(l=>matches(l.when));
  revealSequence($('#dlg'),lines,()=>{
    const b=document.createElement('div');b.className='center mt';
    b.innerHTML='<button class="btn orange" id="btnSee">'+esc(DB.ui.game.seeFeedback)+'</button>';
    $('#actions').appendChild(b);
    $('#btnSee').onclick=()=>showModal(br,br.cost,i);
    scrollEnd();
  });
}
function showModal(item,cost,i){
  const m=DB.ui.modal,last=i===DB.scenes.length-1;
  const chips=[];
  if(cost.time)chips.push('<span class="chip bad">'+esc(fmt(m.timeChip,{t:fmtHours(cost.time)}))+'</span>');
  if(cost.support)chips.push('<span class="chip bad">'+esc(fmt(m.supportChip,{s:cost.support}))+'</span>');
  else chips.push('<span class="chip">'+esc(m.noChange)+'</span>');
  const el=$('#modal');
  el.className='modal';
  el.innerHTML='<div class="sheet"><p class="eyebrow">'+esc(m.title)+'</p>'+
    '<div class="box res"><h4>'+esc(m.happened)+'</h4><p>'+esc(item.feedback)+'</p></div>'+
    '<div class="box ref"><h4>'+esc(m.reflect)+'</h4><p>'+esc(item.reflect)+'</p></div>'+
    '<div class="box lim"><h4>'+esc(m.limit)+'</h4><p>'+esc(item.limit)+'</p></div>'+
    '<h3 class="mt">'+esc(m.changes)+'</h3><div class="chips">'+chips.join('')+'</div>'+
    (last?'':'<p class="bfly">'+esc(m.butterfly)+'</p>')+
    '<div class="center mt"><button class="btn orange" id="btnModalNext">'+esc(last?m.last:m.next)+'</button></div></div>';
  el.hidden=false;
  $('#btnModalNext').onclick=()=>{
    $('#btnModalNext').disabled=true;
    el.hidden=true;el.innerHTML='';
    if(last)finishDay();else goScene(i+1);
  };
}

/* ---------- 後測與結局 ---------- */
function finishDay(){
  const c=DB.ui.curtain;
  curtain(c.endTime,c.endTitle,c.endSub,()=>{renderPost();},null);
}
function renderPost(){
  const u=DB.ui.post;
  $('#hud').hidden=true;
  setScreen('<div class="wrap fade"><p class="eyebrow">'+esc(u.eyebrow)+'</p><h2>'+esc(u.title)+'</h2><p>'+esc(u.desc)+'</p>'+likertHtml()+
    '<div class="q"><p>'+esc(DB.survey.open)+'</p><textarea id="openText" placeholder="'+esc(DB.survey.openPlaceholder)+'"></textarea></div>'+
    '<div class="center mt"><button class="btn orange" id="btnPostGo" disabled>'+esc(u.next)+'</button></div></div>');
  bindLikert(playerState.post,()=>{$('#btnPostGo').disabled=!allAnswered(playerState.post);});
  $('#btnPostGo').onclick=()=>{playerState.post.open=$('#openText').value.trim();saveLocal();renderEnding();};
}
function renderEnding(){
  const u=DB.ui.ending,s=playerState,e=DB.endings[s.endingKey||'C'];
  const sgn=v=>v>0?'+'+v:String(v);
  let h='<div class="wrap fade">';
  h+='<div class="card end-hero"><div class="badge">'+e.icon+'</div><p class="eyebrow">'+esc(u.eyebrow)+'</p><h1 style="font-size:clamp(24px,6vw,32px)">'+esc(e.title)+'</h1>'+
     '<p class="mt">'+esc(e.summary)+'</p>'+
     '<div class="endstats"><span class="chip">⏱ '+esc(fmtHours(s.timeRemaining))+'</span><span class="chip">🤝 '+s.supportPoints+DB.ui.hud.supportUnit+'</span></div>'+
     '<p class="notice">'+esc(u.notScore)+'</p></div>';
  h+='<div class="card mt2"><h2>'+esc(u.thoughtTitle)+'</h2>'+e.takeaways.map(t=>'<p class="mt">'+esc(t)+'</p>').join('')+'</div>';
  h+='<div class="card mt2"><h2>'+esc(u.pathTitle)+'</h2>'+s.history.map(x=>
     '<div class="chain"><div class="rt">'+esc(x.time)+'　'+esc(x.title)+'</div><div class="rc">'+esc(u.pathLabel)+esc(x.label)+'</div>'+
     '<p>'+esc(u.costLabel)+esc(fmtHours(x.costTime))+(x.costSupport?'、'+x.costSupport+' 份支援':'')+'</p>'+
     (x.propsB?'<p>'+esc(fmt(u.propsLabel,{a:x.propsA,b:x.propsB}))+'</p>':'')+'</div>').join('')+'</div>';
  h+='<div class="card mt2"><h2>'+esc(u.flagTitle)+'</h2><p>'+esc(u.flagIntro)+'</p>'+DB.flagReview.map(f=>{
     const on=s.flags[f.key]===true;
     const cls=on?(f.kind==='good'?'good':'on'):(f.kind==='good'?'':'good');
     return '<div class="flagcard '+cls+'"><div class="fh"><span>'+esc(f.label)+'</span><span class="st">'+esc(on?f.stOn:f.stOff)+'</span></div><p>'+esc(on?f.on:f.off)+'</p></div>';
  }).join('')+'</div>';
  h+='<div class="card mt2"><h2>'+esc(u.settleTitle)+'</h2><p>'+esc(u.settleTime)+'：<b>'+esc(fmtHours(s.timeRemaining))+'</b>；'+esc(u.settleSupport)+'：<b>'+s.supportPoints+DB.ui.hud.supportUnit+'</b></p></div>';
  h+='<div class="card mt2"><h2>'+esc(u.surveyTitle)+'</h2><table class="cmp"><tr>'+u.surveyHead.map((t,i)=>'<th'+(i?'':' style="text-align:left"')+'>'+esc(t)+'</th>').join('')+'</tr>'+
     DB.survey.likert.map(q=>'<tr><td>'+esc(q.text)+'</td><td>'+s.pre[q.key]+'</td><td>'+s.post[q.key]+'</td><td><b>'+sgn(s.post[q.key]-s.pre[q.key])+'</b></td></tr>').join('')+'</table>'+
     '<p class="mt"><b>'+esc(u.openLabel)+'</b>'+(s.post.open?esc(s.post.open):'<span style="color:var(--muted)">'+esc(u.openEmpty)+'</span>')+'</p>'+
     '<p class="notice">'+esc(u.localNote)+'</p></div>';
  h+='<div class="card mt2"><h2>'+esc(u.advTitle)+'</h2><ul class="adv">'+DB.advocacy.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div>';
  h+='<div class="card mt2"><h2>'+esc(u.knowTitle)+'</h2><div class="know">'+DB.knowledge.map(k=>'<div><b>'+esc(k.t)+'</b><p>'+esc(k.p)+'</p></div>').join('')+'</div></div>';
  h+='<div class="flag-demo">'+esc(u.demoFlag)+'</div>';
  h+='<div class="warnbox"><b>'+esc(DB.ui.start.warnTitle)+'</b>'+esc(DB.ui.start.resources)+'</div>';
  h+='<p class="notice">'+esc(u.disclaimer)+'</p>';
  h+='<div class="center mt2"><button class="btn orange" id="btnRestart">'+esc(u.restart)+'</button></div></div>';
  setScreen(h);
  $('#hud').hidden=true;
  $('#btnRestart').onclick=()=>{playerState=newPlayerState();renderStart();};
}

/* ---------- 啟動 ---------- */
document.title=DB.meta.title;
playerState=newPlayerState();
renderStart();
</script>
</body>
</html>
